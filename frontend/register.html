<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        .touch__form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #user-info {
            justify-self: end;
            margin-right: 15%;
        }
        #output {
            color: red;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div id="user-info"></div>
<div class="touch__form">
    <label class="touch__label" for="username">Username</label>
    <input class="touch__input" id="username" placeholder="Username" />
    <label class="touch__label" for="email">Email</label>
    <input class="touch__input" type="email" id="email" name="email" placeholder="Email" />
    <label class="touch__label" for="password">Password</label>
    <input class="touch__input" type="password" id="password" placeholder="Password">
    <button class="touch__btn" id="btn-register">Register</button>
    <a class="touch__btn" href="login.html" id="log">Have an account?</a>
    <div id="output"></div>
</div>
<script type="module" src="/src/js/register.js"></script>
<script type="module" src="/src/js/check.js"></script>
</body>
</html>
